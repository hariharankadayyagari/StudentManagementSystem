<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

    <div class="container mt-5">

        <h1 class="fw-bold mb-2">Student Dashboard</h1>
        <h2 class="text-muted fs-5 mb-4">Welcome Student</h2>

        <div class="mb-4">
            <button id="viewStudents" class="btn btn-primary me-2 mb-2">View Students</button>
            <button id="myProfileButton" class="btn btn-success me-2 mb-2">My Profile</button>
            <button id="editProfileButton" class="btn btn-warning me-2 mb-2">Edit Profile</button>
            <button id="logoutButton" class="btn btn-danger mt-2 mb-2">Logout</button>
        </div>

        <div class="card shadow-sm p-4">

            <div id="studentsList"></div>
            <div id="editProfile"></div>
            <div id="myProfile"></div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/student.js"></script>

</body>
</html>
