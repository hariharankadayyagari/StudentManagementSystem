<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>LOGIN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">


                    <h1 class="text-center mb-4 fw-bold">Login</h1>
                    <p class="text-center text-muted mb-4">
                        Sign in to your account
                    </p>

                    <form id="loginform">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" required />
                        </div>

                        <button type="submit" class="btn btn-primary me-2 w-100">Login</button>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <br />
    <br />

    <div class="text-center">
        <a href="/register.html" class="btn btn-outline-secondary mt-2">Register</a>
    </div>

    <p id="message" class="mt-3 text-danger"></p>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
