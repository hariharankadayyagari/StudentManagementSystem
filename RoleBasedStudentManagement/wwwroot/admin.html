<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <!-- Header -->
        <h1 class="fw-bold mb-2">Admin Dashboard</h1>

        <h2 class="text-muted fs-5 mb-4">
            Welcome Admin
        </h2>


        <!-- Dashboard Buttons -->
        <div class="mb-4">

            <button id="viewStudentsButton"
                    class="btn btn-primary me-2 mb-2">
                View Students
            </button>

            <button id="viewTeachersButton"
                    class="btn btn-info me-2 mb-2">
                View Teachers
            </button>

            <button id="manageUsersButton"
                    class="btn btn-success me-2 mb-2">
                Manage Users
            </button>

            <button id="logout"
                    class="btn btn-danger mb-2">
                Logout
            </button>

        </div>


        <!-- Content Area -->
        <div class="card shadow-sm p-4 mt-4">

            <p id="message"></p>

            <div id="viewStudents"></div>

            <div id="viewTeachers"></div>

            <div id="usersList"></div>

        </div>

    </div>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Admin JavaScript -->
    <script src="/js/admin.js"></script>

</body>
</html>
